<!DOCTYPE html>
<html>

<head>
    <title>Form Serah Terima Barang / Pengembalian</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }
        
        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }
        
        th,
        td {
            border: 1px solid #aaa;
            padding: 6px;
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>Form Serah Terima Barang / Pengembalian</h2>

    <select id="jenis">
  <option value="">-- Jenis Transaksi --</option>
  <option value="Barang Keluar">Barang Keluar</option>
  <option value="Barang Pengembalian">Barang Pengembalian</option>
</select>

    <input id="nama" placeholder="Nama Penerima">
    <input id="barang" placeholder="Nama Barang">
    <input id="qty" type="number" placeholder="Qty">

    <select id="satuan">
  <option value="">-- Satuan --</option>
  <option>pcs</option>
  <option>pail</option>
  <option>sak</option>
  <option>box</option>
  <option>kg</option>
  <option>liter</option>
  <option>pack</option>
  <option>drigen</option>
  <option>botol</option>
  <option>karung</option>
  <option>set</option>
  <option>meter</option>
  <option>centimeter</option>
  <option>unit</option>
</select>

    <select id="alokasi">
  <option value="">-- Usage Allocation --</option>
  <option>Stock</option>
  <option>Project</option>
  <option>Produksi</option>
  <option>Maintenance</option>
</select>

    <button onclick="simpan()">Submit</button>

    <hr>

    <h3>Riwayat Serah Terima (Lokal)</h3>
    <table>
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Nama</th>
                <th>Barang</th>
                <th>Qty</th>
                <th>Satuan</th>
                <th>Allocation</th>
                <th>Jenis</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>

    <script>
        // URL Web App Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/xxxxxxxx/exec"; // Ganti dengan URL Web App milikmu

        function simpan() {
            let record = {
                nama: nama.value,
                barang: barang.value,
                qty: qty.value,
                satuan: satuan.value,
                alokasi: alokasi.value,
                jenis: jenis.value
            };

            if (Object.values(record).some(v => !v)) {
                alert("Semua field wajib diisi!");
                return;
            }

            // Simpan lokal (tetap muncul di web)
            let data = JSON.parse(localStorage.getItem("gudang")) || [];
            record.tanggal = new Date().toLocaleString();
            data.push(record);
            localStorage.setItem("gudang", JSON.stringify(data));
            tampilkan();

            // Kirim ke Google Spreadsheet via Apps Script
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams(record)
            }).then(() => console.log("Data terkirim ke spreadsheet"));

            document.querySelectorAll("input, select").forEach(e => e.value = "");
            alert("Data berhasil disimpan!");
        }

        function tampilkan() {
            let data = JSON.parse(localStorage.getItem("gudang")) || [];
            let html = "";
            data.forEach(d => {
                html += `<tr>
                <td>${d.tanggal}</td>
                <td>${d.nama}</td>
                <td>${d.barang}</td>
                <td>${d.qty}</td>
                <td>${d.satuan}</td>
                <td>${d.alokasi}</td>
                <td>${d.jenis}</td>
            </tr>`;
            });
            document.getElementById("data").innerHTML = html;
        }

        tampilkan();
    </script>

</body>

</html>
